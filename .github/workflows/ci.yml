name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check
      - name: Doctests (crate docs and every Rust block in README.md)
        run: cargo test --doc
      - name: Integration tests
        run: cargo test --test '*'
      - name: Run the examples
        run: |
          for e in tape normalize feed_health replay; do
            echo "::group::cargo run --example $e"
            cargo run --quiet --example "$e"
            echo "::endgroup::"
          done
