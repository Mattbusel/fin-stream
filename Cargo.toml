[package]
name = "fin-stream"
version = "2.11.3"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://gitlab.com/mattbusel/fin-stream"
documentation = "https://docs.rs/fin-stream"
homepage = "https://fin-stream-rs.vercel.app/"
readme = "README.md"
authors = ["Matt Busel <matt@busel.dev>"]
keywords = ["market-data", "trading", "crypto", "websocket", "ohlcv"]
categories = ["finance", "asynchronous", "concurrency", "network-programming"]
description = "Turn raw Binance, Coinbase, Alpaca and Polygon trade messages into one exact-decimal tick type, pass them between threads on a lock-free ring, and roll them into OHLCV bars, with feed health checks and replay."
include = ["src/**/*", "benches/**/*", "tests/**/*", "examples/**/*", "proto/**/*", "build.rs", "Cargo.toml", "README.md", "docs/*.md", "LICENSE", "CHANGELOG.md"]

[package.metadata.docs.rs]
# Scrape the examples so docs.rs shows real call sites next to the APIs they use.
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"

[features]
## Enable the gRPC streaming endpoint (adds tonic, prost, tokio-stream, tonic-build deps).
grpc = ["dep:tonic", "dep:prost", "dep:tokio-stream"]

[dependencies]
# tokio: async runtime, channels, timers
tokio = { version = "1.40", features = ["full"] }
# serde: tick normalization, order book serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# thiserror: typed streaming errors
thiserror = "1.0"
# async-trait: trait objects for feed adapters
async-trait = "0.1"
# tokio-tungstenite: async WebSocket
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
# futures: stream combinators
futures-util = "0.3"
# rust_decimal: exact price arithmetic — never use f64 for prices
rust_decimal = { version = "1.35", features = ["serde-with-str"] }
# chrono: timestamp handling
chrono = { version = "0.4", features = ["serde"] }
# dashmap: concurrent order book / health state
dashmap = "5.5"
# uuid: feed/subscription identifiers
uuid = { version = "1.6", features = ["v4", "fast-rng", "serde"] }
# tracing: pipeline observability
tracing = "0.1"
# fin-primitives: tick, orderbook, ohlcv, signals integration
fin-primitives = "2.14"
# tonic: gRPC server/client (optional — grpc feature)
tonic = { version = "0.12", optional = true }
# prost: protobuf runtime (optional — grpc feature)
prost = { version = "0.13", optional = true }
# tokio-stream: stream utilities for gRPC (optional — grpc feature)
tokio-stream = { version = "0.1", optional = true }

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["async_tokio"] }
# rust_decimal_macros: dec!() macro for test literals
rust_decimal_macros = "1.35"
# proptest: property-based tests for FIFO ordering, normalization monotonicity
proptest = "1.4"

[build-dependencies]
# tonic-build: gRPC code generation from proto files (optional — grpc feature)
tonic-build = { version = "0.12", optional = true }

[[bench]]
name = "tick_hot_path"
harness = false
