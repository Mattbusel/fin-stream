[package]
name = "fin-stream"
version = "2.15.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
repository = "https://github.com/Mattbusel/fin-stream"
documentation = "https://docs.rs/fin-stream"
homepage = "https://fin-stream-rs.vercel.app/"
readme = "README.md"
authors = ["Matt Busel <matt@busel.dev>"]
keywords = ["market-data", "trading", "crypto", "websocket", "ohlcv"]
categories = ["finance", "asynchronous", "concurrency", "network-programming"]
description = "Turn raw Binance, Coinbase, Kraken, OKX, Bybit, Alpaca and Polygon trade and quote messages into one exact-decimal tick type, pass them between threads on a lock-free ring, and roll them into OHLCV bars, with feed health checks and replay."
include = ["src/**/*", "benches/**/*", "tests/**/*", "examples/**/*", "proto/**/*", "Cargo.toml", "README.md", "docs/*.md", "LICENSE"]

[package.metadata.docs.rs]
features = ["net", "shared-state", "latency", "fin-primitives", "grpc", "metrics", "barter"]
rustdoc-args = ["--cfg", "docsrs"]
# Scrape the examples so docs.rs shows real call sites next to the APIs they use.
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
# Index loops read better than iterator chains in the matrix and window maths here.
needless_range_loop = "allow"
type_complexity = "allow"

[features]
default = ["net", "shared-state", "latency", "fin-primitives"]
## Async runtime and networking: `WsManager`, the FIX TCP session, replay,
## snapshot replay, portfolio feeds, feed aggregation, anomaly and circuit-breaker
## tasks. Pulls in tokio, tokio-tungstenite, rustls, async-trait and uuid.
## Without it (`default-features = false`) the crate is pure parsing and maths:
## tick and quote normalization, ring buffer, OHLCV bars, order books, analytics.
## That build has no networking dependencies and compiles for `wasm32-unknown-unknown`.
net = ["dep:tokio", "dep:tokio-tungstenite", "dep:rustls", "dep:async-trait", "dep:uuid"]
## Modules that keep per-key state in a concurrent map (`dashmap`): `health`
## (`HealthMonitor`), `orderbook`, `correlation`, `circuit`, `quality`, `risk`,
## `risk_engine`, `depth`, `funding`, `pattern`, `news`, `signal`, `arbitrage`,
## `alpha_engine`, `order_router`, `portfolio_risk`, `position_manager`,
## `position_tracker`, `tick_processor`, and with `net` also `multi_exchange` and
## `portfolio_feed`. The WebSocket client (`ws`) and tick normalization do not need it.
shared-state = ["dep:dashmap"]
## The `latency` module (HDR histogram percentiles). Pulls in `hdrhistogram`.
latency = ["dep:hdrhistogram"]
## `From<fin_primitives::FinError> for StreamError`, so `?` works on fin-primitives calls.
fin-primitives = ["dep:fin-primitives"]
## Emit counters (messages, bytes, reconnects, late ticks) through the `metrics` crate,
## for any recorder: Prometheus, StatsD, OpenTelemetry. Zero cost without a recorder.
metrics = ["dep:metrics"]
## barter-data interop both ways: `PublicTrade::try_from(&NormalizedTick)`, and
## `NormalizedTick::try_from(&MarketEvent<_, PublicTrade>)` to build OHLCV bars from a
## barter-data trade stream. Pulls in barter-data and its deps; needs Rust 1.88+.
barter = ["dep:barter-data", "dep:barter-instrument"]
## Enable the gRPC streaming endpoint (adds tonic, prost and tokio-stream; no protoc needed).
grpc = ["net", "dep:tonic", "dep:prost", "dep:tokio-stream"]

[dependencies]
# tokio: async runtime, channels, timers
tokio = { version = "1.40", features = ["full"], optional = true }
# serde: tick normalization, order book serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# thiserror: typed streaming errors
thiserror = "2.0"
# async-trait: trait objects for feed adapters
async-trait = { version = "0.1", optional = true }
# tokio-tungstenite: async WebSocket
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"], optional = true }
# rustls: TLS for wss:// feeds, with the ring crypto provider (no OpenSSL, no cmake)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
# futures: stream combinators
futures-util = "0.3"
# rust_decimal: exact price arithmetic — never use f64 for prices
rust_decimal = { version = "1.35", features = ["serde-with-str"] }
# chrono: timestamp handling
chrono = { version = "0.4", features = ["serde"] }
# dashmap: concurrent order book / health state
dashmap = { version = "6.1", optional = true }
# uuid: feed/subscription identifiers
uuid = { version = "1.6", features = ["v4", "fast-rng", "serde"], optional = true }
# hdrhistogram: latency percentiles (latency module)
hdrhistogram = { version = "7.5", default-features = false, optional = true }
# tracing: pipeline observability
tracing = "0.1"
# fin-primitives: only for `From<FinError> for StreamError` (optional, default on)
fin-primitives = { version = "2.14", default-features = false, optional = true }
# barter-data / barter-instrument: target types for the `barter` interop feature
barter-data = { version = "0.13", optional = true }
barter-instrument = { version = "0.3", optional = true }
# metrics: counters and histograms through the `metrics` facade (optional `metrics` feature)
metrics = { version = "0.24", optional = true }
# tonic: gRPC server/client (optional — grpc feature)
tonic = { version = "0.12", optional = true }
# prost: protobuf runtime (optional — grpc feature)
prost = { version = "0.13", optional = true }
# tokio-stream: stream utilities for gRPC (optional — grpc feature)
tokio-stream = { version = "0.1", optional = true, features = ["sync"] }

[dev-dependencies]
# tokio for `#[tokio::test]` in modules that do not need the `net` feature
tokio = { version = "1.40", features = ["full"] }
# metrics-util: in-memory recorder to assert on emitted metrics in tests
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
# tokio-stream with `net`: TcpListenerStream for the local gRPC round-trip test
tokio-stream = { version = "0.1", features = ["net"] }
tokio-test = "0.4"
criterion = { version = "0.5", features = ["async_tokio"] }
# rust_decimal_macros: dec!() macro for test literals
rust_decimal_macros = "1.35"
# proptest: property-based tests for FIFO ordering, normalization monotonicity
proptest = "1.4"

[[example]]
name = "barter_candles"
required-features = ["barter"]

[[example]]
name = "replay"
required-features = ["net"]

[[example]]
name = "feed_health"
required-features = ["shared-state"]

[[bench]]
name = "tick_hot_path"
harness = false
